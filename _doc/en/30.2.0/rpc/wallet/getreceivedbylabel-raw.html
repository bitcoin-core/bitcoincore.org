getreceivedbylabel "label" ( minconf ) ( include_immature_coinbase )

Returns the total amount received by addresses with <label> in transactions with at least [minconf] confirmations.

Arguments:
1. label (string)  The selected label, may be the default label using "".
2. minconf (number, optional, default=1)  Only include transactions confirmed at least this many times.
3. include_immature_coinbase (boolean, optional, default=false)  Include immature coinbase transactions.

Result: (string, amount)
